services:
  db-dev:
    image: postgres:17-alpine
    container_name: padel-db-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - pg_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palmdev -d palmdev"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: padel-dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.dev
    depends_on:
      db-dev:
        condition: service_healthy

volumes:
  pg_dev:
